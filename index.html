<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASSWELL — Envanter Yönetim Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070a0f;--bg2:#0d1118;--bg3:#121820;--bg4:#19202d;--bg5:#1f2838;
  --border:#1e2d40;--border2:#2a3f5a;--border3:#3a5070;
  --text:#dde6f0;--text2:#7a8fa8;--text3:#3d5068;
  --accent:#00c8f0;--accent2:#0096bb;--accent3:#003344;--accent4:#001a22;
  --green:#00e090;--green2:#009960;--green3:#001e14;
  --amber:#f5a623;--amber2:#c47d0e;--amber3:#241500;
  --red:#ff4d6a;--red2:#cc2244;--red3:#1f0010;
  --purple:#b06aff;--purple2:#7c3aed;--purple3:#1a0a30;
  --orange:#ff7a35;--orange2:#c85010;--orange3:#1e0e00;
  --font-display:'Rajdhani',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --r:6px;--r2:10px;--r3:14px;--shadow:0 4px 24px rgba(0,0,0,.5);
}
body.light-theme{
  --bg:#f4f6f9;--bg2:#ffffff;--bg3:#f8fafc;--bg4:#edf2f7;--bg5:#e2e8f0;
  --border:#e2e8f0;--border2:#cbd5e1;--border3:#94a3b8;
  --text:#0f172a;--text2:#334155;--text3:#64748b;
  --accent:#0096bb;--accent2:#007a99;--accent3:#e0f2fe;--accent4:#bae6fd;
  --green:#059669;--green2:#10b981;--green3:#d1fae5;
  --amber:#d97706;--amber2:#f59e0b;--amber3:#fef3c7;
  --red:#e11d48;--red2:#f43f5e;--red3:#ffe4e6;
  --purple:#7c3aed;--purple2:#8b5cf6;--purple3:#ede9fe;
  --orange:#ea580c;--orange2:#f97316;--orange3:#ffedd5;
  --shadow:0 4px 16px rgba(0,0,0,.08);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;overflow:hidden;transition:background 0.3s,color 0.3s}

/* ===== LOGIN ===== */
.login-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;z-index:999;
}
.login-box{
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);
  padding:36px 40px;width:380px;max-width:95vw;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:slideUp .3s ease;
}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.login-logo-icon{width:40px;height:40px;border-radius:var(--r2);background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:15px;font-weight:700;color:#000}
.login-logo-name{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:3px;color:var(--accent)}
.login-tagline{font-size:10px;color:var(--text3);letter-spacing:3px;text-transform:uppercase;margin-bottom:28px;padding-left:2px}
.login-title{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:1px;margin-bottom:20px;color:var(--text)}
.login-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.login-label{font-size:11px;color:var(--text2);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.login-input{
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);
  padding:10px 12px;font-size:13px;color:var(--text);outline:none;
  font-family:var(--font-body);width:100%;transition:border-color .15s;
}
.login-input:focus{border-color:var(--accent2);background:var(--bg4)}
.login-input::placeholder{color:var(--text3)}
.login-btn{
  width:100%;padding:11px;background:var(--accent);border:none;border-radius:var(--r2);
  font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:1px;
  color:#000;cursor:pointer;transition:all .15s;margin-top:6px;
}
.login-btn:hover{background:#00e8ff;transform:translateY(-1px)}
.login-err{
  background:var(--red3);border:1px solid var(--red2);border-radius:var(--r2);
  padding:8px 12px;font-size:12px;color:var(--red);margin-top:10px;display:none;
}
.login-hint{font-size:10px;color:var(--text3);text-align:center;margin-top:14px}

/* ===== APP ===== */
.app{display:flex;height:100vh}
.sidebar{
  width:230px;min-width:230px;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  transition:background 0.3s,border-color 0.3s;
}
.sidebar::after{content:'';position:absolute;top:0;right:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,var(--accent3),transparent)}
.logo-area{padding:22px 18px 18px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--bg2),var(--bg3))}
.logo-top{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:var(--r2);background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;font-weight:700;color:#000;flex-shrink:0}
.logo-name{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:3px;color:var(--accent)}
.logo-tagline{font-size:9px;color:var(--text3);letter-spacing:3px;text-transform:uppercase;margin-top:5px;padding-left:2px}
.sidebar-scroll{flex:1;overflow-y:auto;padding:10px 10px 0}
.sidebar-scroll::-webkit-scrollbar{width:3px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nav-group-label{font-size:9px;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase;padding:14px 8px 5px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r2);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;margin-bottom:1px;position:relative;user-select:none}
.nav-item:hover{background:var(--bg4);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,var(--accent4),var(--bg4));color:var(--accent);border:1px solid var(--border2)}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:var(--r) 0 0 var(--r)}
.nav-item i{width:16px;text-align:center;font-size:16px;flex-shrink:0}
.nav-label{flex:1}
.nav-badge{background:var(--red);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;font-family:var(--font-mono)}
.sidebar-footer{padding:12px 10px;border-top:1px solid var(--border);background:var(--bg2)}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r2);background:var(--bg4);border:1px solid var(--border)}
.user-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--purple2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;font-family:var(--font-display);letter-spacing:1px}
.user-info .user-name{font-size:12px;font-weight:500}
.user-info .user-role{font-size:10px;color:var(--text3)}
.user-pill-actions{margin-left:auto;display:flex;gap:4px}
.pill-btn{width:26px;height:26px;border-radius:var(--r);background:var(--bg5);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px}
.pill-btn:hover{color:var(--accent);border-color:var(--accent2)}
.pill-btn.logout:hover{color:var(--red);border-color:var(--red2)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:54px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0;transition:background 0.3s,border-color 0.3s}
.topbar-page{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:1px;white-space:nowrap}
.topbar-sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-wrap input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:8px 12px 8px 34px;font-size:12px;color:var(--text);outline:none;font-family:var(--font-body);transition:border-color .2s,background 0.3s}
.search-wrap input:focus{border-color:var(--accent2);background:var(--bg4)}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r2);font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:var(--font-body);white-space:nowrap}
.btn i{font-size:14px}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:#00e8ff;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.btn-success{background:var(--green3);color:var(--green);border:1px solid var(--green2)}
.btn-success:hover{background:var(--green2);color:#000}
.btn-danger{background:var(--red3);color:var(--red);border:1px solid var(--red2)}
.btn-danger:hover{background:var(--red2);color:#fff}
.btn-amber{background:var(--amber3);color:var(--amber);border:1px solid var(--amber2)}
.btn-amber:hover{background:var(--amber2);color:#000}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:var(--r)}
.btn-icon{width:30px;height:30px;padding:0;justify-content:center;border-radius:var(--r)}
body.light-theme .btn-primary{color:#fff}

.content-area{flex:1;overflow-y:auto;padding:20px 22px}
.content-area::-webkit-scrollbar{width:4px}
.content-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);overflow:hidden;transition:background 0.3s,border-color 0.3s}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-title{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:1px;color:var(--text2)}
.card-body{padding:16px 18px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);padding:16px;position:relative;overflow:hidden;transition:background 0.3s,border-color 0.3s}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.c-accent::before{background:var(--accent)}
.stat-card.c-green::before{background:var(--green)}
.stat-card.c-amber::before{background:var(--amber)}
.stat-card.c-red::before{background:var(--red)}
.stat-card.c-purple::before{background:var(--purple)}
.stat-corner{position:absolute;right:14px;top:14px;font-size:24px;opacity:.12}
.stat-label{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;font-weight:500}
.stat-value{font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:1px;line-height:1.1;margin:4px 0 2px}
.stat-value.c-accent{color:var(--accent)}.stat-value.c-green{color:var(--green)}.stat-value.c-amber{color:var(--amber)}.stat-value.c-red{color:var(--red)}.stat-value.c-purple{color:var(--purple)}
.stat-sub{font-size:11px;color:var(--text3)}

/* TABLES */
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);overflow:hidden;margin-bottom:16px;transition:background 0.3s,border-color 0.3s}
.table-controls{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.table-controls-title{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:1px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg3);font-weight:500;white-space:nowrap}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(0,200,240,.03)}
.td-mono{font-family:var(--font-mono);font-size:11px;color:var(--text3)}
.td-name{font-weight:500}
.td-muted{font-size:11px;color:var(--text3)}
.td-actions{display:flex;gap:4px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.b-default{background:var(--bg4);color:var(--text2);border:1px solid var(--border)}
.b-accent{background:var(--accent4);color:var(--accent);border:1px solid var(--accent3)}
.b-green{background:var(--green3);color:var(--green);border:1px solid var(--green2)}
.b-amber{background:var(--amber3);color:var(--amber);border:1px solid var(--amber2)}
.b-red{background:var(--red3);color:var(--red);border:1px solid var(--red2)}
.b-purple{background:var(--purple3);color:var(--purple);border:1px solid var(--purple2)}
.b-orange{background:var(--orange3);color:var(--orange);border:1px solid var(--orange2)}
.stock-wrap{display:flex;align-items:center;gap:8px;min-width:100px}
.stock-track{height:3px;background:var(--bg5);border-radius:2px;flex:1;overflow:hidden;min-width:50px}
.stock-fill{height:100%;border-radius:2px;transition:width .4s}
.stock-num{font-family:var(--font-mono);font-size:12px;font-weight:500;min-width:24px;text-align:right}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f-input,.f-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:6px 10px;font-size:12px;color:var(--text2);outline:none;font-family:var(--font-body)}
.f-input{color:var(--text)}.f-input::placeholder{color:var(--text3)}
.f-input:focus,.f-select:focus{border-color:var(--accent2);color:var(--text)}
.f-select option{background:var(--bg3)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:500;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);width:640px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-head-title{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:1px}
.modal-close{width:28px;height:28px;border-radius:var(--r);background:var(--bg4);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px}
.modal-close:hover{background:var(--red3);color:var(--red);border-color:var(--red2)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-body::-webkit-scrollbar{width:3px}
.modal-body::-webkit-scrollbar-thumb{background:var(--border2)}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg-full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11px;color:var(--text2);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.form-input,.form-select,.form-textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:8px 11px;font-size:13px;color:var(--text);outline:none;font-family:var(--font-body);width:100%;transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent2);background:var(--bg4)}
.form-input::placeholder{color:var(--text3)}
.form-select option{background:var(--bg3)}
.form-textarea{resize:vertical;min-height:72px;line-height:1.6}
.form-section-label{grid-column:1/-1;font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:2px;color:var(--accent);text-transform:uppercase;padding:12px 0 2px;border-top:1px solid var(--border);margin-top:4px}
.bat-section{grid-column:1/-1;display:contents}

/* PANELS */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);transition:background 0.3s,border-color 0.3s}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.panel-title{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:1px;color:var(--text2)}
.panel-title i{color:var(--accent);font-size:15px}
.panel-body{padding:14px 16px}
.alert-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r2);margin-bottom:6px;cursor:pointer;transition:filter .15s;border:1px solid}
.alert-row:hover{filter:brightness(1.15)}
.alert-row:last-child{margin-bottom:0}
.ar-low{background:rgba(245,166,35,.07);border-color:var(--amber2)}
.ar-critical{background:rgba(255,77,106,.07);border-color:var(--red2)}
.ar-out{background:rgba(176,106,255,.07);border-color:var(--purple2)}
.ar-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ar-dot-low{background:var(--amber)}.ar-dot-critical{background:var(--red)}.ar-dot-out{background:var(--purple)}
.ar-name{font-size:12px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-counts{font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.mov-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.mov-row:last-child{border-bottom:none}
.mov-icon{width:30px;height:30px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.mi-in{background:var(--green3);color:var(--green)}.mi-out{background:var(--red3);color:var(--red)}
.mov-info{flex:1;min-width:0}
.mov-prod{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-meta{font-size:10px;color:var(--text3)}
.mov-qty{font-family:var(--font-mono);font-size:14px;font-weight:600}
.mq-pos{color:var(--green)}.mq-neg{color:var(--red)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:16px}
.prod-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);padding:15px;cursor:pointer;transition:border-color .15s,transform .1s,background 0.3s;position:relative;overflow:hidden}
.prod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.prod-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.pc-id{font-family:var(--font-mono);font-size:10px;color:var(--text3);letter-spacing:1px}
.pc-name{font-weight:500;font-size:13px;margin:3px 0 6px;line-height:1.3}
.pc-mfr{font-size:11px;color:var(--text3);margin-bottom:8px}
.pc-bat{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.pc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.pc-loc{font-size:10px;color:var(--text3)}
.pc-note{font-size:10px;color:var(--text3);font-style:italic;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.cat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);padding:16px;border-left:4px solid;transition:background 0.3s,border-color 0.3s}
.cat-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-card-icon{font-size:20px}
.cat-card-name{font-family:var(--font-display);font-size:14px;font-weight:600}
.cat-card-stats{display:flex;gap:20px}
.cat-stat-item{font-size:12px}
.detail-section{background:var(--bg3);border-radius:var(--r2);padding:14px;margin-bottom:12px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item{background:var(--bg4);padding:10px 12px;border-radius:var(--r2)}
.detail-key{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.detail-val{font-size:13px;font-weight:500;margin-top:2px}
.detail-bat-banner{background:linear-gradient(90deg,var(--accent4),var(--bg3));border:1px solid var(--accent3);border-radius:var(--r2);padding:12px 14px;margin-bottom:12px}
.detail-bat-title{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:2px;color:var(--accent);margin-bottom:8px}
.detail-bat-specs{display:flex;gap:8px;flex-wrap:wrap}
.stock-hero{background:var(--bg3);border-radius:var(--r2);padding:14px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.sh-number{font-family:var(--font-display);font-size:42px;font-weight:700;line-height:1}
.sh-unit{font-size:12px;color:var(--text3)}
.sh-bar-wrap{flex:1;height:6px;background:var(--bg5);border-radius:3px;overflow:hidden;margin-top:2px}
.sh-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:11px 16px;font-size:12px;max-width:280px;box-shadow:var(--shadow);animation:slideInToast .25s ease;pointer-events:all}
@keyframes slideInToast{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-item.t-success{border-left:3px solid var(--green)}.toast-item.t-error{border-left:3px solid var(--red)}.toast-item.t-info{border-left:3px solid var(--accent)}.toast-item.t-warn{border-left:3px solid var(--amber)}
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-state i{font-size:36px;margin-bottom:10px;display:block;opacity:.4}
.empty-state p{font-size:13px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.page-header h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:1px}
.page-subtitle{font-size:12px;color:var(--text3);margin-top:2px}
.page-header-actions{display:flex;gap:8px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg3);border-radius:var(--r2);margin-bottom:8px}
.setting-info h4{font-size:13px;font-weight:500}
.setting-info p{font-size:11px;color:var(--text3);margin-top:2px}
.toggle-switch{position:relative;width:44px;height:24px;cursor:pointer;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--bg5);border:1px solid var(--border2);border-radius:12px;transition:background .2s}
.toggle-switch input:checked+.toggle-track{background:var(--accent2);border-color:var(--accent)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle-switch input:checked~.toggle-thumb{transform:translateX(20px)}
.loc-depot{padding:8px 10px;cursor:pointer;border-radius:var(--r2);display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
.loc-depot:hover{background:var(--bg4)}
.loc-shelf{padding:6px 10px 6px 32px;font-size:12px;color:var(--text2);cursor:pointer;border-radius:var(--r2);display:flex;align-items:center;gap:6px}
.loc-shelf:hover{background:var(--bg4);color:var(--text)}
.loc-compartment{padding:5px 10px 5px 52px;font-size:11px;color:var(--text3);cursor:pointer;border-radius:var(--r2)}
.loc-compartment:hover{background:var(--bg4);color:var(--text2)}
@media(max-width:768px){.sidebar{display:none}.two-col{grid-template-columns:1fr}.stats-row{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.fg-full{grid-column:1}}
*::-webkit-scrollbar{width:4px;height:4px}

<script>
// ==========================================
// SUPABASE AYARLARI 
// ==========================================
const supabaseUrl = 'https://jtcmnyvfppdrhudnbesx.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0Y21ueXZmcHBkcmh1ZG5iZXN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDQwMTUsImV4cCI6MjA5NTg4MDAxNX0.-8RIetH6yMqL2TejiBcanUW4MWej_e7vBuLdCbU_6tA';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

// ===== AUTH =====
const ADMIN = {user:'admin', pass:'12345678'};
let isLoggedIn = false;

async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  if (u === ADMIN.user && p === ADMIN.pass) {
    isLoggedIn = true;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    
    // Login olunca Supabase'den verileri çek
    await fetchDataFromSupabase();
    
    navigate('dashboard');
    err.style.display = 'none';
  } else {
    err.style.display = 'block';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
  }
}

function doLogout() {
  if (!confirm('Çıkış yapmak istediğinize emin misiniz?')) return;
  isLoggedIn = false;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-err').style.display = 'none';
}

// ===== DATA =====
const CATS = [
  {id:'bat',name:'Bataryalar',color:'#00c8f0',icon:'ti-battery-charging-2'},
  {id:'bms',name:'BMS ve Elektronik',color:'#b06aff',icon:'ti-circuit-board'},
  {id:'case',name:'Kasa (Case)',color:'#ff7a35',icon:'ti-cube'},
  {id:'kab',name:'Kablolama',color:'#00e090',icon:'ti-plug'},
  {id:'sar',name:'Şarj Sistemleri',color:'#f5a623',icon:'ti-bolt'},
  {id:'tes',name:'Test ve Üretim Ekipmanları',color:'#ff4d6a',icon:'ti-device-analytics'},
  {id:'oth',name:'Diğer',color:'#7a8fa8',icon:'ti-dots'},
];

let prods = [];
let movements = [];
let settings = {trackingEnabled:true, lowStockNotify:true};
let currentPage = 'dashboard';
let invFilters = {search:'',cat:'',status:'',voltage:'',capacity:'',sortBy:'',sortDir:'asc'};
let movFilters = {type:''};

// --- SUPABASE VERİ ÇEKME FONKSİYONU ---
async function fetchDataFromSupabase() {
  showToast('Veriler yükleniyor...', 'info');
  const { data: pData, error: pErr } = await supabaseClient.from('products').select('*');
  if(pData) prods = pData;
  if(pErr) console.error("Ürün çekme hatası:", pErr);

  const { data: mData, error: mErr } = await supabaseClient.from('movements').select('*');
  if(mData) movements = mData;
  if(mErr) console.error("Hareket çekme hatası:", mErr);
}

// ===== THEME =====
function toggleTheme() {
  document.body.classList.toggle('light-theme');
  const isLight = document.body.classList.contains('light-theme');
  document.getElementById('theme-btn').innerHTML = isLight ? '<i class="ti ti-moon"></i>' : '<i class="ti ti-sun"></i>';
}

// ===== HELPERS =====
const cat = id => CATS.find(c=>c.id===id) || CATS[6];
const prod = id => prods.find(p=>p.id===id);

function stockStatus(p) {
  if (p.qty===0) return {label:'Stokta Yok',cls:'b-purple',type:'out',color:'var(--purple)'};
  if (p.qty<=p.threshold*0.5) return {label:'Kritik Stok',cls:'b-red',type:'critical',color:'var(--red)'};
  if (p.qty<=p.threshold) return {label:'Düşük Stok',cls:'b-amber',type:'low',color:'var(--amber)'};
  return {label:'Yeterli',cls:'b-green',type:'ok',color:'var(--green)'};
}
function stockPct(p) {
  if (!p.threshold||p.qty===0) return 0;
  return Math.min(100,Math.round(p.qty/p.threshold*100));
}
function today() { return new Date().toISOString().split('T')[0]; }
function alertProds() { return prods.filter(p=>p.qty<=p.threshold); }

function getNumVal(id, min=0) {
  const el = document.getElementById(id);
  if (!el) return min;
  let v = Number(el.value);
  if (isNaN(v)||v<min) return min;
  return v;
}

// ===== NAVIGATION =====
const PAGE_TITLES = {dashboard:'Ana Sayfa',inventory:'Envanter',products:'Ürünler',categories:'Kategoriler',movements:'Stok Hareketleri',alerts:'Düşük Stok Uyarıları',locations:'Depo Yönetimi',settings:'Ayarlar'};
const PAGE_RENDERERS = {dashboard:renderDashboard,inventory:renderInventory,products:renderProducts,categories:renderCategories,movements:renderMovements,alerts:renderAlerts,locations:renderLocations,settings:renderSettings};

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const navEl = document.getElementById('nav-'+page);
  if (navEl) navEl.classList.add('active');
  document.getElementById('topbar-title').textContent = PAGE_TITLES[page]||page;
  document.getElementById('content').innerHTML = PAGE_RENDERERS[page] ? PAGE_RENDERERS[page]() : '';
  refreshBadges();
}

function refreshBadges() {
  const cnt = alertProds().length;
  const b = document.getElementById('badge-alerts');
  if (b) { b.textContent=cnt; b.style.display=cnt>0?'':'none'; }
}

function refreshPage() { navigate(currentPage); }

// ===== DASHBOARD =====
function renderDashboard() {
  const total=prods.length;
  const totalQty=prods.reduce((a,b)=>a+Number(b.qty),0);
  const lowCnt=prods.filter(p=>p.qty>0&&p.qty<=p.threshold&&p.qty>p.threshold*0.5).length;
  const critCnt=prods.filter(p=>p.qty>0&&p.qty<=p.threshold*0.5).length;
  const outCnt=prods.filter(p=>p.qty===0).length;
  const alerts=alertProds().slice(0,6);
  const recMov=[...movements].reverse().slice(0,6);

  return `
<div class="stats-row">
  <div class="stat-card c-accent"><i class="ti ti-box stat-corner"></i><div class="stat-label">Toplam Ürün</div><div class="stat-value c-accent">${total}</div><div class="stat-sub">Kayıtlı çeşit</div></div>
  <div class="stat-card c-green"><i class="ti ti-packages stat-corner"></i><div class="stat-label">Toplam Stok</div><div class="stat-value c-green">${totalQty.toLocaleString('tr')}</div><div class="stat-sub">Tüm birimlerde</div></div>
  <div class="stat-card c-accent"><i class="ti ti-category stat-corner"></i><div class="stat-label">Kategoriler</div><div class="stat-value c-accent">${CATS.length}</div><div class="stat-sub">Aktif kategori</div></div>
  <div class="stat-card c-amber"><i class="ti ti-alert-triangle stat-corner"></i><div class="stat-label">Düşük Stok</div><div class="stat-value c-amber">${lowCnt}</div><div class="stat-sub">Eşik altında</div></div>
  <div class="stat-card c-red"><i class="ti ti-flame stat-corner"></i><div class="stat-label">Kritik Stok</div><div class="stat-value c-red">${critCnt}</div><div class="stat-sub">Acil yenileme</div></div>
  <div class="stat-card c-purple"><i class="ti ti-ban stat-corner"></i><div class="stat-label">Stokta Yok</div><div class="stat-value c-purple">${outCnt}</div><div class="stat-sub">Tükenmiş ürün</div></div>
</div>
<div class="two-col">
  <div class="panel">
    <div class="panel-head"><i class="ti ti-alert-triangle" style="color:var(--amber)"></i><div class="panel-title">Stok Uyarıları</div></div>
    <div class="panel-body">
      ${alerts.length===0
        ?`<div class="empty-state"><i class="ti ti-check"></i><p>Uyarı gerektiren ürün yok!</p></div>`
        :alerts.map(p=>{const s=stockStatus(p);return`<div class="alert-row ar-${s.type}" onclick="navigate('alerts')"><span class="ar-dot ar-dot-${s.type}"></span><span class="ar-name">${p.name}</span><span class="ar-counts">${p.qty}/${p.threshold}</span><span class="badge ${s.cls}">${s.label}</span></div>`;}).join('')
      }
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><i class="ti ti-arrows-exchange" style="color:var(--accent)"></i><div class="panel-title">Son Hareketler</div></div>
    <div class="panel-body">
      ${recMov.length===0
        ?`<div class="empty-state"><i class="ti ti-list-search"></i><p>Henüz hareket kaydı yok.</p></div>`
        :recMov.map(m=>{const p=prod(m.prodId)||{name:'Silinmiş Ürün',id:'?'};return`<div class="mov-row"><div class="mov-icon ${m.type==='in'?'mi-in':'mi-out'}"><i class="ti ti-${m.type==='in'?'arrow-down':'arrow-up'}"></i></div><div class="mov-info"><div class="mov-prod">${p.name}</div><div class="mov-meta">${m.reason} · ${m.date}</div></div><div class="mov-qty ${m.type==='in'?'mq-pos':'mq-neg'}">${m.type==='in'?'+':'-'}${m.qty}</div></div>`;}).join('')
      }
    </div>
  </div>
</div>
<div class="panel">
  <div class="panel-head"><i class="ti ti-chart-bar" style="color:var(--accent)"></i><div class="panel-title">Kategori Özeti</div></div>
  <div class="panel-body" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
    ${CATS.map(c=>{const cp=prods.filter(p=>p.cat===c.id);const qty=cp.reduce((a,b)=>a+Number(b.qty),0);const warn=cp.filter(p=>p.qty<=p.threshold).length;return`<div style="background:var(--bg3);border-radius:var(--r2);padding:11px 13px;border-left:3px solid ${c.color}"><div style="display:flex;align-items:center;gap:7px;margin-bottom:7px"><i class="ti ${c.icon}" style="color:${c.color};font-size:15px"></i><span style="font-size:12px;font-weight:500">${c.name}</span></div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3)"><span>${cp.length} çeşit</span><span style="color:${c.color};font-family:var(--font-mono);font-size:13px;font-weight:500">${qty}</span></div>${warn>0?`<div style="font-size:10px;color:var(--amber);margin-top:4px"><i class="ti ti-alert-triangle" style="font-size:10px"></i> ${warn} uyarı</div>`:''}</div>`;}).join('')}
  </div>
</div>`;
}

// ===== INVENTORY =====
function renderInventory() {
  return `
<div class="page-header">
  <div><h1>Envanter</h1><div class="page-subtitle">Tüm stok kalemleri ve durumları</div></div>
  <div class="page-header-actions">
    <button class="btn btn-ghost" onclick="openMovementModal()"><i class="ti ti-arrows-exchange"></i> Hareket Ekle</button>
    <button class="btn btn-primary" onclick="openProductModal()"><i class="ti ti-plus"></i> Yeni Ürün</button>
  </div>
</div>
<div class="table-wrap">
  <div class="table-controls">
    <div class="table-controls-title">Ürün Listesi</div>
    <div class="filter-row" style="margin-left:auto">
      <input class="f-input" id="inv-search" type="text" placeholder="Ara..." style="width:160px" value="${invFilters.search}" oninput="invFilters.search=this.value;refreshInvTable()">
      <select class="f-select" onchange="invFilters.cat=this.value;refreshInvTable()">
        <option value="">Tüm Kategoriler</option>
        ${CATS.map(c=>`<option value="${c.id}" ${invFilters.cat===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
      <select class="f-select" onchange="invFilters.status=this.value;refreshInvTable()">
        <option value="">Tüm Durumlar</option>
        <option value="ok">Yeterli</option>
        <option value="low">Düşük Stok</option>
        <option value="critical">Kritik</option>
        <option value="out">Stokta Yok</option>
      </select>
      <select class="f-select" onchange="invFilters.voltage=this.value;refreshInvTable()">
        <option value="">Voltaj (Tüm)</option>
        ${[...new Set(prods.filter(p=>p.isBat&&p.voltage).map(p=>Number(p.voltage)||0))].sort((a,b)=>a-b).map(v=>`<option value="${v}">${v}V</option>`).join('')}
      </select>
      <select class="f-select" onchange="invFilters.capacity=this.value;refreshInvTable()">
        <option value="">Amper (Tüm)</option>
        ${[...new Set(prods.filter(p=>p.isBat&&p.capacity).map(p=>Number(p.capacity)||0))].sort((a,b)=>a-b).map(v=>`<option value="${v}">${v}Ah</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="table-scroll" id="inv-table-body">${renderInvRows()}</div>
</div>`;
}

function refreshInvTable() {
  const el=document.getElementById('inv-table-body');
  if(el) el.innerHTML=renderInvRows();
}

function renderInvRows() {
  let list=prods.filter(p=>{
    const s=stockStatus(p);
    const q=invFilters.search.toLowerCase();
    if(invFilters.cat&&p.cat!==invFilters.cat) return false;
    if(invFilters.voltage && p.voltage != invFilters.voltage) return false;
    if(invFilters.capacity && p.capacity != invFilters.capacity) return false;
    if(invFilters.status){
      if(invFilters.status==='ok'&&s.type!=='ok') return false;
      if(invFilters.status==='low'&&s.type!=='low') return false;
      if(invFilters.status==='critical'&&s.type!=='critical') return false;
      if(invFilters.status==='out'&&s.type!=='out') return false;
    }
    if(q&&!(p.id+p.name+p.cat+p.mfr+p.loc).toLowerCase().includes(q)) return false;
    return true;
  });
  if(!list.length) return`<div class="empty-state"><i class="ti ti-search"></i><p>Ürün bulunamadı. Sağ üstten yeni ürün ekleyebilirsiniz.</p></div>`;
  return`<table>
    <thead><tr><th>Ürün ID</th><th>Ürün Adı</th><th>Kategori</th><th>Stok</th><th>Konum</th><th>Durum</th><th>İşlemler</th></tr></thead>
    <tbody>
      ${list.map(p=>{const c=cat(p.cat);const s=stockStatus(p);const pct=stockPct(p);return`<tr>
        <td><span class="td-mono">${p.id}</span></td>
        <td><div class="td-name">${p.name}</div><div class="td-muted">${p.mfr}</div>
          ${p.isBat?`<div style="display:flex;gap:4px;margin-top:4px"><span class="badge b-accent">${p.voltage}V</span><span class="badge b-accent">${p.capacity}Ah</span></div>`:''}
          ${p.isCase?`<div style="display:flex;gap:4px;margin-top:4px"><span class="badge b-amber">${p.material}</span><span class="badge b-default">${p.width}x${p.length}x${p.height}mm</span></div>`:''}
        </td>
        <td><div style="display:flex;align-items:center;gap:6px"><i class="ti ${c.icon}" style="color:${c.color};font-size:14px"></i><span style="font-size:12px;color:var(--text2)">${c.name}</span></div></td>
        <td><div class="stock-wrap"><div class="stock-track"><div class="stock-fill" style="width:${pct}%;background:${s.color}"></div></div><span class="stock-num" style="color:${s.color}">${p.qty}</span><span style="font-size:10px;color:var(--text3)">${p.unit}</span></div></td>
        <td><span style="font-size:11px;color:var(--text3)"><i class="ti ti-map-pin" style="font-size:10px"></i> ${p.loc||'—'}</span></td>
        <td><span class="badge ${s.cls}">${s.label}</span></td>
        <td><div class="td-actions">
          <button class="btn btn-ghost btn-xs btn-icon" title="Detay" onclick="openDetailModal('${p.id}')"><i class="ti ti-eye"></i></button>
          <button class="btn btn-ghost btn-xs btn-icon" title="Düzenle" onclick="openProductModal('${p.id}')"><i class="ti ti-edit"></i></button>
          <button class="btn btn-success btn-xs btn-icon" title="Stok Güncelle" onclick="openStockModal('${p.id}')"><i class="ti ti-plus-minus"></i></button>
          <button class="btn btn-danger btn-xs btn-icon" title="Sil" onclick="deleteProd('${p.id}')"><i class="ti ti-trash"></i></button>
        </div></td>
      </tr>`;}).join('')}
    </tbody>
  </table>`;
}

// ===== PRODUCTS =====
function renderProducts() {
  return`
<div class="page-header">
  <div><h1>Ürünler</h1><div class="page-subtitle">Kart görünümü — tüm ürün detayları</div></div>
  <div class="page-header-actions">
    <input class="f-input" id="prod-search" type="text" placeholder="Ara..." style="width:200px" oninput="filterProdGrid(this.value)">
    <button class="btn btn-primary" onclick="openProductModal()"><i class="ti ti-plus"></i> Yeni Ürün</button>
  </div>
</div>
<div class="prod-grid" id="prod-grid">${renderProdCards(prods)}</div>`;
}

function filterProdGrid(v) {
  const f=v.toLowerCase();
  const el=document.getElementById('prod-grid');
  if(el) el.innerHTML=renderProdCards(prods.filter(p=>(p.id+p.name+p.mfr+p.cat).toLowerCase().includes(f)));
}

function renderProdCards(list) {
  if(!list.length) return`<div class="empty-state" style="grid-column:1/-1"><i class="ti ti-search"></i><p>Görüntülenecek ürün yok. Sağ üstten ekleyebilirsiniz.</p></div>`;
  return list.map(p=>{const c=cat(p.cat);const s=stockStatus(p);return`<div class="prod-card" style="--card-color:${c.color}" onclick="openDetailModal('${p.id}')">
    <style>.prod-card[style*="${c.color}"]::before{background:${c.color}}</style>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div class="pc-id">${p.id}</div><div class="pc-name">${p.name}</div><div class="pc-mfr"><i class="ti ${c.icon.replace('ti-','ti-')}" style="color:${c.color};font-size:11px"></i> ${p.mfr||'—'} · ${c.name}</div></div>
      <span class="badge ${s.cls}" style="flex-shrink:0;margin-left:8px">${s.label}</span>
    </div>
    ${p.isBat?`<div class="pc-bat"><span class="badge b-accent">${p.voltage}V</span><span class="badge b-accent">${p.capacity}Ah</span><span class="badge b-default">${p.chemistry}</span>${p.config?`<span class="badge b-default">${p.config}</span>`:''}</div>`:''}
    ${p.isCase?`<div class="pc-bat"><span class="badge b-amber">${p.material}</span><span class="badge b-default">${p.width}x${p.length}x${p.height} mm</span></div>`:''}
    <div class="pc-footer"><span class="pc-loc"><i class="ti ti-map-pin"></i> ${p.loc||'—'}</span><span style="font-family:var(--font-mono);font-size:14px;font-weight:600;color:${s.color}">${p.qty} <span style="font-size:10px;color:var(--text3)">${p.unit}</span></span></div>
    ${p.notes?`<div class="pc-note">"${p.notes}"</div>`:''}
  </div>`;}).join('');
}

// ===== CATEGORIES =====
function renderCategories() {
  return`
<div class="page-header">
  <div><h1>Kategoriler</h1><div class="page-subtitle">Ürün grupları ve istatistikleri</div></div>
</div>
<div class="cat-cards">
  ${CATS.map(c=>{const cp=prods.filter(p=>p.cat===c.id);const qty=cp.reduce((a,b)=>a+Number(b.qty),0);const warn=cp.filter(p=>p.qty<=p.threshold).length;const out=cp.filter(p=>p.qty===0).length;return`<div class="cat-card" style="border-left-color:${c.color}">
    <div class="cat-card-head"><i class="ti ${c.icon} cat-card-icon" style="color:${c.color}"></i><div class="cat-card-name">${c.name}</div></div>
    <div class="cat-card-stats">
      <div class="cat-stat-item"><span>Çeşit: </span><strong>${cp.length}</strong></div>
      <div class="cat-stat-item"><span>Toplam: </span><strong style="color:${c.color};font-family:var(--font-mono)">${qty}</strong></div>
      ${warn?`<div class="cat-stat-item"><span style="color:var(--amber)">Uyarı: </span><strong style="color:var(--amber)">${warn}</strong></div>`:''}
      ${out?`<div class="cat-stat-item"><span style="color:var(--purple)">Tükenen: </span><strong style="color:var(--purple)">${out}</strong></div>`:''}
    </div>
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      ${cp.slice(0,3).map(p=>{const s=stockStatus(p);return`<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3px 0;color:var(--text2)"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">${p.name}</span><span class="badge ${s.cls}" style="margin-left:8px">${p.qty}</span></div>`;}).join('')}
      ${cp.length>3?`<div style="font-size:10px;color:var(--text3);padding-top:4px">+${cp.length-3} daha...</div>`:''}

    </div>
  </div>`;}).join('')}
</div>`;
}

<div class="page-header">

<div class="table-wrap"><div id="mov-table-body">${renderMovRows()}</div></div>`;

function refreshMovTable() {
  const el=document.getElementById('mov-table-body');

        <td><span class="td-mono">${m.date}</span></td>
      </tr>`;}).join('')}

}

// ===== ALERTS =====
function renderAlerts() {
  const low=prods.filter(p=>p.qty>0&&p.qty<=p.threshold&&p.qty>p.threshold*0.5);
  const crit=prods.filter(p=>p.qty>0&&p.qty<=p.threshold*0.5);
  const out=prods.filter(p=>p.qty===0);
  return`
<div class="page-header"><div><h1>Düşük Stok Uyarıları</h1><div class="page-subtitle">Eşik değerinin altına düşen ürünler</div></div></div>
<div class="stats-row" style="grid-template-columns:repeat(3,1fr);max-width:480px;margin-bottom:20px">
  <div class="stat-card c-amber"><div class="stat-label">Düşük</div><div class="stat-value c-amber">${low.length}</div></div>
  <div class="stat-card c-red"><div class="stat-label">Kritik</div><div class="stat-value c-red">${crit.length}</div></div>
  <div class="stat-card c-purple"><div class="stat-label">Tükendi</div><div class="stat-value c-purple">${out.length}</div></div>
</div>
${alertProds().length===0
  ?`<div class="empty-state" style="padding:80px"><i class="ti ti-check" style="font-size:48px;color:var(--green)"></i><p style="font-size:14px">Tüm ürünler yeterli stokta!</p></div>`
  :`<div class="table-wrap"><table>
    <thead><tr><th>Ürün</th><th>Mevcut</th><th>Eşik</th><th>Doluluk</th><th>Durum</th><th>Konum</th><th>İşlem</th></tr></thead>
    <tbody>
      ${alertProds().map(p=>{const s=stockStatus(p);const pct=stockPct(p);return`<tr>
        <td><div class="td-name">${p.name}</div><div class="td-muted">${p.id} · ${p.mfr||'—'}</div></td>
        <td><span style="font-family:var(--font-mono);font-size:16px;font-weight:600;color:${s.color}">${p.qty}</span> <span style="font-size:10px;color:var(--text3)">${p.unit}</span></td>
        <td><span style="font-family:var(--font-mono);font-size:13px;color:var(--text2)">${p.threshold}</span></td>
        <td><div class="stock-wrap"><div class="stock-track" style="width:80px"><div class="stock-fill" style="width:${pct}%;background:${s.color}"></div></div><span style="font-size:11px;color:var(--text3)">${pct}%</span></div></td>
        <td><span class="badge ${s.cls}">${s.label}</span></td>
        <td style="font-size:11px;color:var(--text3)">${p.loc||'—'}</td>
        <td><button class="btn btn-success btn-xs" onclick="openStockModal('${p.id}')"><i class="ti ti-plus"></i> Stok Ekle</button></td>
      </tr>`;}).join('')}
    </tbody>
  </table></div>`
}`;
}

// ===== MODALS =====
function openModal(title, body, foot) {
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-foot').innerHTML=foot;
  document.getElementById('modal-overlay').style.display='flex';
}
function closeModal() { document.getElementById('modal-overlay').style.display='none'; }

function openDetailModal(id) {
  const p=prod(id); if(!p) return;
  const c=cat(p.cat); const s=stockStatus(p); const pct=stockPct(p);
  const body=`
    <div class="stock-hero">
      <div>
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px">Mevcut Stok</div>

        <div class="sh-unit">${p.unit}</div>

      <div style="flex:1">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:6px"><span>Uyarı Eşiği: ${p.threshold}</span><span>${pct}%</span></div>
        <div class="sh-bar-wrap"><div class="sh-bar-fill" style="width:${pct}%;background:${s.color}"></div></div>
        <div style="margin-top:8px"><span class="badge ${s.cls}">${s.label}</span></div>
      </div>
    </div>
    ${p.isBat?`<div class="detail-bat-banner"><div class="detail-bat-title"><i class="ti ti-battery-charging-2"></i> Batarya Teknik Bilgileri</div><div class="detail-bat-specs"><span class="badge b-accent" style="font-size:12px;padding:4px 10px">${p.voltage}V</span><span class="badge b-accent" style="font-size:12px;padding:4px 10px">${p.capacity}Ah</span><span class="badge b-default">${p.chemistry}</span>${p.config?`<span class="badge b-default">${p.config}</span>`:''}${p.packver?`<span class="badge b-default">v${p.packver}</span>`:''}${p.serial?`<span class="badge b-accent"><i class="ti ti-hash" style="font-size:9px"></i>${p.serial}</span>`:''}</div></div>`:''}
    ${p.isCase?`<div class="detail-bat-banner" style="border-color:var(--amber);background:linear-gradient(90deg,var(--amber3),var(--bg3))"><div class="detail-bat-title" style="color:var(--amber)"><i class="ti ti-cube"></i> Kasa Teknik Bilgileri</div><div class="detail-bat-specs"><span class="badge b-amber" style="font-size:12px;padding:4px 10px">${p.material}</span><span class="badge b-default">En: ${p.width} mm</span><span class="badge b-default">Boy: ${p.length} mm</span><span class="badge b-default">Yükseklik: ${p.height} mm</span></div></div>`:''}
    <div class="detail-section">
      <div class="detail-grid">
        ${[['Ürün ID',p.id],['Kategori',c.name],['Üretici',p.mfr||'—'],['Tedarikçi',p.sup||'—'],['Birim',p.unit],['Konum',p.loc||'—'],['Ekleme',p.added||'—'],['Güncelleme',p.updated||'—']].map(([k,v])=>`<div class="detail-item"><div class="detail-key">${k}</div><div class="detail-val">${v}</div></div>`).join('')}

function toggleCatFields() {

  if(bat) bat.style.display = (c === 'bat') ? 'contents' : 'none';

// --- SUPABASE VERİ YAZMA / GÜNCELLEME ---
async function saveProduct(editId) {
  const name=document.getElementById('f-name')?.value.trim();
  if(!name){showToast('Ürün Adı zorunludur!','error');return;}
  
  const id = editId ? editId : 'MSW-' + Date.now().toString().slice(-6);
  const selectedCat = document.getElementById('f-cat')?.value || 'bat';
  const isBat = (selectedCat === 'bat');
  const isCase = (selectedCat === 'case');
  
  const obj={
    id, name, cat: selectedCat,
    mfr: document.getElementById('f-mfr')?.value||'',
    sup: document.getElementById('f-sup')?.value||'',
    qty: getNumVal('f-qty',0),
    unit: document.getElementById('f-unit')?.value||'Adet',
    loc: document.getElementById('f-loc')?.value||'',
    threshold: getNumVal('f-threshold',0),
    notes: document.getElementById('f-notes')?.value||'',
    updated: today(),
    isBat: isBat,
    isCase: isCase
  };
  
  if(!editId) obj.added=today();
  
  if(isBat){
    obj.voltage = document.getElementById('f-voltage')?.value || null;
    obj.capacity = document.getElementById('f-capacity')?.value || null;
    obj.config = document.getElementById('f-config')?.value||'';
    obj.chemistry = document.getElementById('f-chemistry')?.value||'Li-Ion';
    obj.packver = document.getElementById('f-packver')?.value||'';
    obj.serial = document.getElementById('f-serial')?.value||'';
  } else {
    obj.voltage=null; obj.capacity=null; obj.config=''; obj.chemistry=''; obj.packver=''; obj.serial='';
  }

  if(isCase){
    obj.material = document.getElementById('f-material')?.value||'Plastik';
    obj.width = document.getElementById('f-width')?.value || null;
    obj.length = document.getElementById('f-length')?.value || null;
    obj.height = document.getElementById('f-height')?.value || null;
  } else {
    obj.material=''; obj.width=null; obj.length=null; obj.height=null;
  }

  // Supabase'e gönder
  const { error } = await supabaseClient.from('products').upsert(obj);
  
  if (error) {
    showToast('Kayıt başarısız: ' + error.message, 'error');
  } else {
    showToast(editId ? `"${name}" güncellendi.` : `"${name}" eklendi.`, 'success');
    await fetchDataFromSupabase();
    closeModal();
    refreshPage();
  }
}

// --- SUPABASE VERİ SİLME ---
async function deleteProd(id) {
  const p=prod(id);
  if(!confirm(`"${p?.name}" silinsin mi? Bu işlem geri alınamaz.`)) return;
  
  const { error } = await supabaseClient.from('products').delete().eq('id', id);
  if (error) {
    showToast('Silme işlemi başarısız: ' + error.message, 'error');
  } else {
    showToast(`"${p?.name}" silindi.`, 'error');
    await fetchDataFromSupabase();
    refreshPage();
  }
}

// --- SUPABASE STOK GÜNCELLEME (HAREKET EKLENTİSİ) ---
async function applyStock(id) {
  const p=prod(id); if(!p) return;
  const type=document.getElementById('sk-type')?.value;
  const qty=getNumVal('sk-qty',0);
  const reason=document.getElementById('sk-reason')?.value||'Manuel';
  const thr=getNumVal('sk-threshold',0);
  
  let newQty = Number(p.qty);
  if(type==='in') newQty += qty;
  else if(type==='out'){
    if(newQty<qty){showToast('Yetersiz stok! Çıkış yapılamaz.','error');return;}
    newQty -= qty;
  } else { newQty=qty; }

  // 1. Ürünü güncelle
  const updatedProd = { ...p, qty: newQty, threshold: thr, updated: today() };
  const { error: pErr } = await supabaseClient.from('products').upsert(updatedProd);
  
  if (pErr) { showToast('Stok güncellenemedi', 'error'); return; }

  // 2. Hareketi veritabanına ekle
  if(settings.trackingEnabled && type !== 'set' && qty > 0) {
    const movObj = { prodId: id, type: type==='in'?'in':'out', qty: qty, date: updatedProd.updated, reason: reason };
    await supabaseClient.from('movements').insert([movObj]);
  }

  showToast(`Stok güncellendi. Yeni miktar: ${newQty} ${p.unit}`, 'success');
  await fetchDataFromSupabase();
  closeModal();
  refreshPage();
}

function openMovementModal() {
  if(prods.length===0){showToast('Önce ürün eklemelisiniz.','warn');return;}
  const body=`<div class="form-grid">
    <div class="form-group fg-full">
      <label class="form-label">Ürün *</label>
      <select class="form-select" id="mv-prod">
        ${prods.map(p=>`<option value="${p.id}">${p.id} — ${p.name}</option>`).join('')}

      <select class="form-select" id="mv-type">
        <option value="in">Giriş (+)</option>
        <option value="out">Çıkış (−)</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Miktar *</label>
      <input type="number" step="any" class="form-input" id="mv-qty" value="1" min="0">
    </div>

      <label class="form-label">Neden</label>
      <input type="text" class="form-input" id="mv-reason" placeholder="Satın Alma, Üretim, Test, Arıza...">
    </div>
  </div>`;
  openModal('Stok Hareketi Ekle',body,
    `<button class="btn btn-ghost" onclick="closeModal()">İptal</button>
     <button class="btn btn-primary" onclick="saveMovement()"><i class="ti ti-check"></i> Kaydet</button>`

}

// --- SUPABASE YENİ HAREKET ---
async function saveMovement() {
  const prodId=document.getElementById('mv-prod')?.value;
  const type=document.getElementById('mv-type')?.value;
  const qty=getNumVal('mv-qty',1);
  const reason=document.getElementById('mv-reason')?.value||'Manuel';
  const p=prod(prodId);
  
  if(!p||qty<=0){showToast('Geçerli ürün ve miktar giriniz.','error');return;}
  
  let newQty = Number(p.qty);
  if(type==='out'&& newQty<qty){showToast('Yetersiz stok!','error');return;}
  
  if(type==='in') newQty += qty; else newQty -= qty;

  const updatedProd = { ...p, qty: newQty, updated: today() };
  await supabaseClient.from('products').upsert(updatedProd);
  
  const movObj = { prodId: prodId, type: type, qty: qty, date: today(), reason: reason };
  await supabaseClient.from('movements').insert([movObj]);

  showToast(`Hareket kaydedildi. "${p.name}" yeni stok: ${newQty}`, 'success');
  await fetchDataFromSupabase();
  closeModal();
  refreshPage();
}

// ===== EXPORT / IMPORT =====
function exportData() {
  const data={products:prods,movements,exportDate:today(),version:'1.0'};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`masswell-envanter-${today()}.json`;
  a.click();
  showToast('JSON verisi dışa aktarıldı.','success');
}

async function importData() {
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange= async e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload= async ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.products&&Array.isArray(data.products)){
          // JSON verilerini Supabase'e toplu (bulk) gönder
          showToast('Buluta yükleniyor, bekleyin...', 'info');
          await supabaseClient.from('products').upsert(data.products);
          if(data.movements && data.movements.length > 0) {
             await supabaseClient.from('movements').insert(data.movements);
          }
          await fetchDataFromSupabase();
          showToast(`Veriler buluta aktarıldı.`,'success');
          refreshPage();
        } else {showToast('Geçersiz dosya formatı.','error');}
      } catch{showToast('Dosya okunamadı.','error');}
    };
    reader.readAsText(file);
  };
  input.click();
}

function exportCSV() {
  if(!prods.length){ showToast('Dışa aktarılacak veri yok.','warn'); return; }
  const headers = ['id','name','cat','voltage','capacity','qty','threshold','chemistry','loc','mfr','sup','unit','config','packver','serial','notes','added','updated','material','width','length','height'];
  let csv = headers.join(',') + '\n';
  prods.forEach(p => {
    const row = headers.map(h => `"${(p[h]||'').toString().replace(/"/g, '""')}"`);
    csv += row.join(',') + '\n';
  });
  const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `masswell-envanter-${today()}.csv`;
  a.click();
  showToast('CSV dosyası dışa aktarıldı.','success');
}

async function importCSV() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv';
  input.onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const text = ev.target.result;
        const rows = text.split('\n').map(r=>r.trim()).filter(r=>r);
        if(rows.length < 2) { showToast('CSV boş veya sadece başlık içeriyor.','error'); return; }
        const headers = rows[0].split(',').map(h=>h.replace(/"/g,''));
        
        let newItems = [];
        let count = 0;
        
        for(let i=1; i<rows.length; i++) {
          const vals = rows[i].split(',').map(v=>v.replace(/(^"|"$)/g,'').replace(/""/g,'"'));
          let obj = {updated: today()};
          headers.forEach((h,idx)=>{ 
            if(vals[idx] !== "") obj[h] = vals[idx]; 
          });
          
          obj.qty = Number(obj.qty)||0;
          obj.threshold = Number(obj.threshold)||0;
          obj.isBat = (obj.cat === 'bat');
          obj.isCase = (obj.cat === 'case');

          if(obj.name) {
            if(!obj.id) obj.id = 'MSW-'+Date.now().toString().slice(-6)+count;
            newItems.push(obj);
            count++;
          }
        }
        
        showToast('Buluta yükleniyor...', 'info');
        await supabaseClient.from('products').upsert(newItems);
        await fetchDataFromSupabase();
        showToast(`${count} ürün başarıyla eklendi.`,'success');
        refreshPage();
      } catch (err) { console.error(err); showToast('Dosya formatı hatalı.','error'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ===== TOAST =====
let toastId=0;
function showToast(msg,type='info') {
  const wrap=document.getElementById('toast-wrap');
  const id=++toastId;
  const div=document.createElement('div');
  div.className=`toast-item t-${type}`;
  div.innerHTML=msg;div.id='toast-'+id;
  wrap.appendChild(div);
  setTimeout(()=>{const el=document.getElementById('toast-'+id);if(el){el.style.opacity='0';el.style.transform='translateX(40px)';el.style.transition='all .3s';setTimeout(()=>el.remove(),300);}},3000);
}
